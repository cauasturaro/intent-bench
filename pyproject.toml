[project]
name = "intent-bench"
version = "0.1.0"
description = "Intent classification on BANKING77: TF-IDF + LogReg vs DistilBERT vs LLM API"
authors = [
    { name = "cauasturaro", email = "caua.sturaro111@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "datasets>=5.2.0",
    "joblib>=1.6.0",
    "numpy>=2.5.5",
    "openai>=3.54.0",
    "pandas>=3.1.1",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "torch>=2.15.0",
    "transformers>=5.23.0",
]

[build-system]
requires = ["uv_build>=0.13.9,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jupyter>=1.1.1",
    "pytest>=9.2.0",
]
